<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Quản lý thiệp cưới</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <!-- Đăng nhập -->
  <section id="loginView" class="login" hidden>
    <form id="loginForm" class="login-card">
      <h1>Quản lý thiệp cưới</h1>
      <p class="muted">Đăng nhập bằng tài khoản admin đã tạo trong Supabase.</p>
      <label>Email<input name="email" type="email" required autocomplete="username"></label>
      <label>Mật khẩu<input name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn btn-primary" type="submit">Đăng nhập</button>
      <p id="loginMsg" class="msg" role="status"></p>
    </form>
  </section>

  <section id="setupView" class="login" hidden>
    <div class="login-card">
      <h1>Chưa kết nối Supabase</h1>
      <p>Mở file <code>config.js</code> và điền <b>SUPABASE_URL</b> cùng <b>SUPABASE_ANON_KEY</b> của bạn, rồi tải lại trang. Xem hướng dẫn trong README.md.</p>
    </div>
  </section>

  <!-- Khu quản lý -->
  <div id="appView" class="app" hidden>
    <header class="topbar">
      <strong class="brand">Thiệp cưới · Admin</strong>
      <div class="topbar-actions">
        <a id="viewSite" class="btn btn-ghost" target="_blank" rel="noopener">Xem trang cưới</a>
        <button id="logoutBtn" class="btn btn-ghost" type="button">Đăng xuất</button>
      </div>
    </header>
    <nav id="tabs" class="tabs" aria-label="Mục quản lý"></nav>
    <main id="panel" class="panel"></main>
    <div class="savebar" id="savebar" hidden>
      <span id="dirtyMsg">Có thay đổi chưa lưu</span>
      <button id="saveBtn" class="btn btn-primary" type="button">Lưu thay đổi</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="defaults.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="admin.js"></script>
</body>
</html>
